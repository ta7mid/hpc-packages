patches:
  "5.9.2":
    - patch_file: "patches/0001-cmake-fix-mpi-include-dirs.patch"
      patch_description: "Replace deprecated MPI_INCLUDE_PATH (unset by Conan's MPIConfig.cmake) with a generator expression pulling INTERFACE_INCLUDE_DIRECTORIES directly from the MPI::MPI_C imported target, so that OBJECT libraries inside libga (notably ga_src and armci_comex, which transitively pull in armci.h -> mpi.h) see the MPI headers at compile time."
      patch_type: "conan"
